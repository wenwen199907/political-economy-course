<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>政治经济学｜课堂教学课件</title>
  <style>
    :root{--paper:#f5f2ea;--ink:#11100e;--red:#d92d20;--muted:#68645d;--line:rgba(17,16,14,.18)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}
    main{min-height:100vh;padding:clamp(2rem,7vw,7rem);display:grid;align-content:center;gap:clamp(1.5rem,4vw,4rem);background:linear-gradient(rgba(17,16,14,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(17,16,14,.045) 1px,transparent 1px);background-size:72px 72px}
    header{border-left:clamp(8px,1vw,14px) solid var(--red);padding-left:clamp(1rem,2vw,2rem)}
    h1{font-size:clamp(2.5rem,6vw,6.5rem);line-height:1;margin:0;letter-spacing:-.055em}p{font-size:clamp(1rem,1.5vw,1.35rem);color:var(--muted);margin:.8rem 0 0}
    nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
    a{display:flex;min-height:clamp(190px,30vh,320px);padding:clamp(1.2rem,2.3vw,2.4rem);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);color:inherit;text-decoration:none;flex-direction:column;justify-content:space-between;background:rgba(255,255,255,.48)}
    a:hover,a:focus-visible{background:var(--ink);color:#fff;outline:none}a:hover small,a:focus-visible small{color:#ffb5ad}
    strong{font-size:clamp(1.3rem,2.2vw,2.25rem);line-height:1.2}small{color:var(--red);font-weight:800;font-size:clamp(.8rem,1vw,1rem)}
    footer{font-size:.9rem;color:var(--muted)}
    @media(max-width:850px){nav{grid-template-columns:1fr}a{min-height:150px}}
  </style>
</head>
<body>
  <main>
    <header><h1>政治经济学</h1><p>大学本科课堂课件 · 单文件可编辑版本</p></header>
    <nav aria-label="课程课件">
      <a href="lecture01-v6.html"><small>第1讲 · 18页概念总结修订版</small><strong>我们究竟在研究什么？</strong><span>已移除时间与右上角标记，并重做完整总结和思考题</span></a>
      <a href="lecture02.html"><small>融合课 · 30页</small><strong>研究什么、为什么这样研究、怎样研究？</strong><span>研究对象、性质、任务、经济规律与研究方法</span></a>
      <a href="lecture03.html"><small>第3讲 · 25页</small><strong>理论为什么必须在实践中不断发展？</strong><span>导论第四、第五节：理论创立、发展与新时代最新成果</span></a>
      <a href="lecture04.html"><small>第4讲 · 52页 · 约125分钟</small><strong>商品：从有用的产品到社会关系</strong><span>商品二因素、劳动二重性、基本矛盾与价值量</span></a>
    </nav>
    <footer>方向键、空格或滚轮翻页；按 E 进入浏览器内编辑模式。</footer>
  </main>
</body>
</html>
