  <style>
    :root{--paper:#f5f2ea;--ink:#11100e;--red:#d92d20;--muted:#68645d;--line:rgba(17,16,14,.18)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}
    main{min-height:100vh;padding:clamp(2rem,6vw,6rem);display:grid;align-content:center;gap:clamp(1.5rem,3vw,3rem);background:linear-gradient(rgba(17,16,14,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(17,16,14,.045) 1px,transparent 1px);background-size:72px 72px}

    nav.part-one{grid-template-columns:repeat(2,minmax(0,1fr))}
    a{display:flex;min-height:clamp(190px,30vh,320px);padding:clamp(1.2rem,2.3vw,2.4rem);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);color:inherit;text-decoration:none;flex-direction:column;justify-content:flex-start;background:rgba(255,255,255,.48)}
    a:hover,a:focus-visible{background:var(--ink);color:#fff;outline:none}a:hover small,a:focus-visible small{color:#ffb5ad}
    strong{font-size:clamp(1.3rem,2.2vw,2.25rem);line-height:1.2;margin:auto 0}small{color:var(--red);font-weight:800;font-size:clamp(.8rem,1vw,1rem)}
    footer{font-size:.9rem;color:var(--muted)}
    @media(max-width:1000px){nav,nav.part-one{grid-template-columns:1fr}a{min-height:150px}}
  </style>
</head>
